# Settings every ShopLite service shares, served by the config server.
# A service's own file (catalog-service.properties, ...) wins over this one.

# Where the discovery server (Eureka) is.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# On one laptop every service is on localhost. Without this, Eureka registered the first
# network interface it found (a virtual adapter here). In containers, prefer the IP instead.
eureka.instance.hostname=localhost
# A readable instance id: catalog-service:8281 instead of host name + application + port.
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Trace every request in this environment (the built-in default samples 10 percent).
management.tracing.sampling.probability=1.0
