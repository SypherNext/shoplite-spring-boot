# Development profile: chatty logs so you can see what the app and Hibernate are doing.
logging.level.com.shoplite=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# Uncomment to also log the values bound to each SQL parameter.
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Trace every request locally (the default samples 10 percent).
management.tracing.sampling.probability=1.0
