spring.application.name=order-service
server.port=8282
spring.profiles.default=dev
# Shared defaults from libs/web-common first, then the config server (optional: the service still
# starts when the config server is down, with the defaults).
spring.config.import=classpath:shoplite-defaults.properties,optional:configserver:http://localhost:8288

# ---- Data: the "orders" database, owned by this service only ----
spring.datasource.url=jdbc:postgresql://localhost:18232/orders
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.username=shoplite
# Development only. Production reads every address and secret from environment variables.
spring.datasource.password=shoplite-dev-only
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto

# ---- API versioning: clients pick 1.0 or 2.0 with the API-Version header ----
spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.default=1.0
spring.mvc.apiversion.supported=1.0,2.0

# ---- Other services this one calls ----
# The catalog reserves stock for new orders (HTTP service client group "catalog").
# lb://catalog-service: Spring Cloud LoadBalancer asks Eureka where catalog-service instances run.
spring.http.serviceclient.catalog.base-url=lb://catalog-service
spring.http.serviceclient.catalog.connect-timeout=1s
spring.http.serviceclient.catalog.read-timeout=2s
# ---- Circuit breaker around the catalog calls (Resilience4j) ----
# Look at the last 10 calls; once at least 5 were made and half of them failed, open the circuit.
resilience4j.circuitbreaker.instances.catalog.sliding-window-size=10
resilience4j.circuitbreaker.instances.catalog.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.catalog.failure-rate-threshold=50
# Stay open for 10 seconds, then let 2 trial calls through (half-open).
resilience4j.circuitbreaker.instances.catalog.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.catalog.permitted-number-of-calls-in-half-open-state=2
# Only an unavailable catalog counts as a failure. A 409 (out of stock) is a normal answer.
resilience4j.circuitbreaker.instances.catalog.record-exceptions=com.shoplite.orders.CatalogUnavailableException
# The HTTP client already has timeouts (above); no second time limit on top.
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true
# Run the call on the caller's thread. On a separate pool thread the security context (needed for
# the token relay) and the current trace would be missing.
spring.cloud.circuitbreaker.resilience4j.disable-thread-pool=true
# With a CircuitBreakerFactory present, Spring Cloud wraps EVERY HTTP service client group in a breaker
# with no fallback, and errors turn into NoFallbackAvailableException (500). ShopLite wraps the catalog
# calls itself, where it can decide what a failure means, so the automatic wrapping is off.
spring.cloud.circuitbreaker.http-services.enabled=false

spring.http.serviceclient.payments.base-url=http://localhost:18190
spring.http.serviceclient.payments.connect-timeout=2s
spring.http.serviceclient.payments.read-timeout=3s
shoplite.webhooks.connect-timeout=2s
shoplite.webhooks.read-timeout=3s

# ---- Kafka: order events leave through the transactional outbox ----
spring.kafka.bootstrap-servers=localhost:18292
spring.kafka.producer.properties[max.block.ms]=5000
shoplite.outbox.poll-interval=500ms
shoplite.outbox.batch-size=100
shoplite.outbox.send-timeout=5s
shoplite.outbox.retention=7d

# ---- RabbitMQ: webhook deliveries ----
spring.rabbitmq.host=localhost
spring.rabbitmq.port=18272
spring.rabbitmq.username=shoplite
spring.rabbitmq.password=shoplite-dev-only
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

# ---- Spring Modulith: re-deliver unfinished events on startup ----
spring.modulith.events.republish-outstanding-events-on-restart=true

# ---- Idempotency keys ----
shoplite.idempotency.retention=24h
shoplite.idempotency.cleanup-cron=0 0 * * * *
