# Production profile: every address and secret comes from environment variables.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
spring.http.serviceclient.payments.base-url=${PAYMENT_PROVIDER_URL}
shoplite.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Production never starts Docker Compose.
spring.docker.compose.enabled=false

# Swagger UI and the OpenAPI document are a development tool here. Turning them off
# in production keeps the full API map away from strangers. Turn them back on if
# your API is public and the docs are part of the product.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# One JSON object per log line, ready for a log collector.
logging.structured.format.console=ecs
logging.level.com.shoplite=INFO
