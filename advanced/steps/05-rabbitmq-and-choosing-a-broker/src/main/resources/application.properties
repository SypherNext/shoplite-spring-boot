spring.application.name=shoplite
# The advanced course runs everything on 82xx ports, next to anything from courses 1 and 2.
server.port=8280

# Run with the dev profile unless you choose another one (for example --spring.profiles.active=prod).
spring.profiles.default=dev

# ---- Data ----
# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Close the database session when the service method ends, not when the HTTP response is written.
spring.jpa.open-in-view=false
# Page requests: ?page=0&size=20&sort=name,asc. Nobody gets more than 100 rows at once.
spring.data.web.pageable.max-page-size=100
# Serialize pages as a stable {content, page} JSON shape (PagedModel), not Spring's internal PageImpl.
spring.data.web.pageable.serialization-mode=via-dto

# ---- Shop settings, bound to the ShopProperties record ----
shoplite.shop.name=ShopLite
shoplite.shop.currency=EUR
shoplite.shop.low-stock-threshold=5

# ---- API versioning (Spring Framework 7) ----
# Clients choose a version with the API-Version header. No header means 1.0.
spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.default=1.0
spring.mvc.apiversion.supported=1.0,2.0

# ---- Security: JWT access tokens issued by Keycloak ----
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:18180/realms/shoplite
# Only accept tokens that were issued for this API.
spring.security.oauth2.resourceserver.jwt.audiences=shoplite-api
# Keycloak puts the realm roles in a "roles" claim (see keycloak/shoplite-realm.json).
# Spring Security turns each one into an authority: CUSTOMER becomes ROLE_CUSTOMER.
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_
spring.security.oauth2.resourceserver.jwt.principal-claim-name=preferred_username
# Browser apps allowed to call the API from another origin.
shoplite.cors.allowed-origins=http://localhost:5173

# ---- Calling other services ----
# The payment provider is an HTTP service client in the "payments" group.
spring.http.serviceclient.payments.base-url=http://localhost:18190
spring.http.serviceclient.payments.connect-timeout=2s
spring.http.serviceclient.payments.read-timeout=3s
# Order webhooks go to customer-supplied URLs, so they get short timeouts too.
shoplite.webhooks.connect-timeout=2s
shoplite.webhooks.read-timeout=3s

# ---- Caching ----
spring.cache.redis.time-to-live=10m

# ---- Kafka ----
spring.kafka.bootstrap-servers=localhost:18292
# Values travel as JSON (Jackson 3). No type header: the consumer decides which class it reads into.
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties[spring.json.add.type.headers]=false
# When the broker is unreachable, give up after 5 seconds instead of the default 60.
spring.kafka.producer.properties[max.block.ms]=5000
# A message that is not valid JSON must not crash the consumer in a loop: the ErrorHandlingDeserializer
# catches the failure and hands it to the error handler (which sends it to the dead letter topic).
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# A new consumer group starts at the oldest message it has not seen, not only at new ones.
spring.kafka.consumer.auto-offset-reset=earliest

# ---- RabbitMQ: webhook deliveries ----
# A failed delivery is retried twice (after 1 s, then 2 s), so 3 attempts in all. After that the
# message is rejected and RabbitMQ moves it to the dead letter queue shoplite.webhooks.failed.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

# ---- Transactional outbox ----
# The relay looks for unsent rows twice a second and sends up to 100 per round.
shoplite.outbox.poll-interval=500ms
shoplite.outbox.batch-size=100
shoplite.outbox.send-timeout=5s
shoplite.outbox.retention=7d

# ---- Idempotency keys ----
shoplite.idempotency.retention=24h
# Spring cron: second minute hour day month weekday. Runs at the top of every hour.
shoplite.idempotency.cleanup-cron=0 0 * * * *

# ---- Threads ----
# Tomcat requests, @Async and @Scheduled all run on virtual threads.
spring.threads.virtual.enabled=true

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# ---- OpenAPI / Swagger UI ----
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
