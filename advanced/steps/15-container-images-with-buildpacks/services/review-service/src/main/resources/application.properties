spring.application.name=review-service
server.port=8283
spring.profiles.default=dev
spring.config.import=classpath:shoplite-defaults.properties,optional:configserver:http://localhost:8288

# ---- Data: the "reviews" database. The app reads and writes through R2DBC (non-blocking). ----
spring.r2dbc.url=r2dbc:postgresql://localhost:18232/reviews
spring.r2dbc.username=shoplite
spring.r2dbc.password=shoplite-dev-only
# Flyway needs a JDBC connection of its own; it runs once at startup, before any request.
spring.flyway.url=jdbc:postgresql://localhost:18232/reviews
spring.flyway.user=shoplite
spring.flyway.password=shoplite-dev-only

# The catalog, to check that a product exists before it is reviewed. The host name is the Eureka
# service id: the @LoadBalanced WebClient.Builder asks Spring Cloud LoadBalancer for an instance.
shoplite.catalog.base-url=http://catalog-service

# Errors as RFC 9457 Problem Details (application/problem+json), like the other services.
spring.webflux.problemdetails.enabled=true
