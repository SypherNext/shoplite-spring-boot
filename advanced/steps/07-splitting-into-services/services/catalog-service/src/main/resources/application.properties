spring.application.name=catalog-service
server.port=8281
spring.profiles.default=dev

# ---- Data: the "catalog" database, owned by this service only ----
spring.datasource.url=jdbc:postgresql://localhost:18232/catalog
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.username=shoplite
# Development only. Production reads every address and secret from environment variables.
spring.datasource.password=shoplite-dev-only
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto
spring.data.redis.url=redis://localhost:18279
spring.cache.redis.time-to-live=10m

# ---- Kafka: this service only consumes order events ----
spring.kafka.bootstrap-servers=localhost:18292
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# ---- Security: JWT access tokens issued by Keycloak ----
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:18180/realms/shoplite
spring.security.oauth2.resourceserver.jwt.audiences=shoplite-api
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_
spring.security.oauth2.resourceserver.jwt.principal-claim-name=preferred_username
shoplite.cors.allowed-origins=http://localhost:5173
# ---- Shop settings (ShopProperties, from libs/web-common) ----
shoplite.shop.name=ShopLite
shoplite.shop.currency=EUR
shoplite.shop.low-stock-threshold=5

# ---- Observability: traces, metrics and logs to Grafana LGTM (compose.yaml) ----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:18318/v1/traces
management.otlp.metrics.export.url=http://localhost:18318/v1/metrics
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:18318/v1/logs

spring.threads.virtual.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
