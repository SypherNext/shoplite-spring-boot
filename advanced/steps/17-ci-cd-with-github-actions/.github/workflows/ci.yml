# Continuous integration for the ShopLite services.
# This file works when this folder is the root of its own Git repository on GitHub
# (GitHub only reads workflows from .github/workflows at the repository root).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token may only read the repository, unless a job asks for more.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Caches Gradle's downloads between runs and adds a build summary to the run page.
      - uses: gradle/actions/setup-gradle@v6

      # Compiles every project and runs every test. Testcontainers starts PostgreSQL, Kafka,
      # RabbitMQ and Redis in the runner's Docker.
      - name: Build and test
        run: ./gradlew build

      - name: Keep the test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  images:
    name: Container images
    needs: build
    # Only for commits on main, never for pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build images with Cloud Native Buildpacks
        run: ./gradlew bootBuildImage

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every image gets the commit id as its tag, so a deployment names exactly what it runs.
      - name: Push images
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.sha }}
        run: |
          registry="ghcr.io/${OWNER,,}"
          for service in catalog-service order-service review-service gateway config-server discovery-server; do
            docker tag "shoplite/$service:0.1.0" "$registry/$service:$TAG"
            docker push "$registry/$service:$TAG"
          done