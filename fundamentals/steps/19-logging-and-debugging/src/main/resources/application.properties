spring.application.name=shoplite

# Run with the dev profile unless you choose another one (for example --spring.profiles.active=prod).
spring.profiles.default=dev

# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Close the database session when the service method ends, not when the HTTP response is written.
spring.jpa.open-in-view=false

# Shop settings, bound to the ShopProperties record.
shoplite.shop.name=ShopLite
shoplite.shop.currency=EUR
shoplite.shop.low-stock-threshold=5
