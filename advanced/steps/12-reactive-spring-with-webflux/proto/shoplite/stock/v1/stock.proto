// The stock API between the order service and the catalog service.
// Both services generate their Java classes from this one file (see their build.gradle.kts).
syntax = "proto3";

package shoplite.stock.v1;

option java_multiple_files = true;
option java_package = "com.shoplite.stock.v1";

service StockService {
  // Takes stock for every line, or for none. The same reservation_id twice returns the first answer.
  rpc Reserve(ReserveRequest) returns (ReserveReply);
  // Puts a reservation's stock back. Unknown or already released ids change nothing.
  rpc Release(ReleaseRequest) returns (ReleaseReply);
}

message StockLine {
  int64 product_id = 1;
  int32 quantity = 2;
}

message ReserveRequest {
  string reservation_id = 1;
  repeated StockLine lines = 2;
}

message ReservedProduct {
  int64 id = 1;
  string sku = 2;
  string name = 3;
  // Money as a decimal string ("9.80"): protobuf has no decimal type, and a double would round.
  string price = 4;
}

message ReserveReply {
  repeated ReservedProduct products = 1;
}

message ReleaseRequest {
  string reservation_id = 1;
}

message ReleaseReply {
}