# Production: every address comes from environment variables.
spring.ai.ollama.base-url=${OLLAMA_URL}
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
spring.http.serviceclient.catalog.base-url=${CATALOG_URL}
shoplite.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT}
management.otlp.metrics.export.url=${OTLP_METRICS_ENDPOINT}
management.opentelemetry.logging.export.otlp.endpoint=${OTLP_LOGS_ENDPOINT}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
logging.structured.format.console=ecs
logging.level.com.shoplite=INFO
