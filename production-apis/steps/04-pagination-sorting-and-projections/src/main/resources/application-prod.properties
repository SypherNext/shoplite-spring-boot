# Production profile: the database comes from environment variables, never from this file.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Production never starts Docker Compose.
spring.docker.compose.enabled=false

# One JSON object per log line, ready for a log collector.
logging.structured.format.console=ecs
logging.level.com.shoplite=INFO
