spring.application.name=config-server
server.port=8288

# The "native" profile reads plain files instead of a Git repository. CONFIG_REPO can point
# elsewhere (a mounted volume in a container); the default is the config-repo folder of this build.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO:file:../../config-repo/}

management.endpoints.web.exposure.include=health,info
