apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: shoplite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  # Replace pods one at a time, and only remove an old one when a new one is ready.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          # Built with ./gradlew bootBuildImage and copied into the cluster with "kind load docker-image".
          image: shoplite/catalog-service:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: shoplite-shared
            - secretRef:
                name: shoplite-database
          env:
            - name: DATABASE_URL
              value: jdbc:postgresql://postgres:5432/catalog
            - name: REDIS_URL
              value: redis://redis:6379
          ports:
            - name: http
              containerPort: 8281
            - name: grpc
              containerPort: 9281
          # Spring Boot notices it runs in Kubernetes and exposes these two health groups.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: shoplite
spec:
  selector:
    app: catalog-service
  ports:
    - name: http
      port: 8281
    - name: grpc
      port: 9281
