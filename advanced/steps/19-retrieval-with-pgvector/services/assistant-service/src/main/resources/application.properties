spring.application.name=assistant-service
server.port=8284
spring.profiles.default=dev
spring.config.import=classpath:shoplite-defaults.properties,optional:configserver:http://localhost:8288

# ---- The language model: Ollama in Docker (compose.yaml, port 18434) ----
spring.ai.ollama.base-url=http://localhost:18434
# A 3-billion-parameter model that runs on a laptop CPU (about 1.9 GB). Pull it once:
#   docker exec shoplite-ollama ollama pull qwen2.5:3b
spring.ai.ollama.chat.model=qwen2.5:3b
# Low temperature: fewer creative detours, more answers built from the tool results.
spring.ai.ollama.chat.temperature=0.2
# Embeddings: a 274 MB model that turns text into 768 numbers. Pull it once:
#   docker exec shoplite-ollama ollama pull nomic-embed-text
spring.ai.ollama.embedding.model=nomic-embed-text

# ---- The vector store: PostgreSQL with pgvector, database "assistant" ----
spring.datasource.url=jdbc:postgresql://localhost:18232/assistant
spring.datasource.username=shoplite
spring.datasource.password=shoplite-dev-only
# Flyway creates the table (V1__create_vector_store.sql); Spring AI only checks it.
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=768

# ---- The catalog's public product API (HTTP service client group "catalog") ----
spring.http.serviceclient.catalog.base-url=lb://catalog-service
spring.http.serviceclient.catalog.connect-timeout=1s
spring.http.serviceclient.catalog.read-timeout=2s
