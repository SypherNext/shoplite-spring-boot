apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: shoplite
data:
  init.sql: |
    create database catalog owner shoplite;
    create database reviews owner shoplite;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: shoplite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.7-alpine
          env:
            - name: POSTGRES_USER
              value: shoplite
            - name: POSTGRES_DB
              value: shoplite
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shoplite-database
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "shoplite"]
            periodSeconds: 5
      volumes:
        # Data lives in the pod (emptyDir) and is lost with it: fine for a laptop cluster.
        # A real database needs a PersistentVolume, or better, a managed database.
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shoplite
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
