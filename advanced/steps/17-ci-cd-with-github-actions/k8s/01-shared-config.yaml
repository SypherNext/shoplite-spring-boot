# Settings every ShopLite service reads as environment variables (envFrom in each Deployment).
apiVersion: v1
kind: ConfigMap
metadata:
  name: shoplite-shared
  namespace: shoplite
data:
  SPRING_PROFILES_ACTIVE: prod
  # Stack space for 50 platform threads instead of 250: requests run on virtual threads (lesson 15).
  BPL_JVM_THREAD_COUNT: "50"
  # Kubernetes Services give every service a DNS name: no Eureka, no config server needed here.
  EUREKA_CLIENT_ENABLED: "false"
  SPRING_CLOUD_CONFIG_ENABLED: "false"
  SPRING_CLOUD_LOADBALANCER_ENABLED: "false"
  JWT_ISSUER_URI: http://localhost:18180/realms/shoplite
  CORS_ALLOWED_ORIGINS: http://localhost:5173
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  DATABASE_USERNAME: shoplite
  # No Grafana in this cluster: the services export to an address nobody listens on, and log a warning.
  OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
  OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
  OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
---
# Secrets are base64-encoded, not encrypted. In a real cluster they come from a secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: shoplite-database
  namespace: shoplite
type: Opaque
stringData:
  # Development only. Never reuse this password anywhere real.
  DATABASE_PASSWORD: shoplite-dev-only
  POSTGRES_PASSWORD: shoplite-dev-only
